<article class="card card--project{% if project.featured %} card--project-featured{% endif %}">
  <div class="project-top"><span class="small-label">{{ project.category | escape }}</span><span class="project-symbol" aria-hidden="true">{{ project.symbol }}</span></div>
  <h3>{{ project.title | escape }}</h3>
  <p>{{ project.description | escape }}</p>
  {% if project.impact %}<p class="card-note">{{ project.impact | escape }}</p>{% endif %}
  {% if project.url %}<a class="text-link" href="{{ project.url }}"{% if project.target %} target="{{ project.target }}"{% endif %}{% if project.rel %} rel="{{ project.rel }}"{% endif %}>{{ project.cta | default: 'Learn more' | escape }} <span aria-hidden="true">↗</span></a>{% endif %}
</article>
