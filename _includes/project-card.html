<article class="card card--project{% if project.featured %} card--project-featured{% endif %}">
  <h3>{{ project.title }}</h3>
  <p>{{ project.description }}</p>
  {% if project.impact %}
    <p class="card-note">{{ project.impact }}</p>
  {% endif %}
  {% if project.url %}
    <a class="text-link" href="{{ project.url }}"{% if project.target %} target="{{ project.target }}"{% endif %}{% if project.rel %} rel="{{ project.rel }}"{% endif %}>{{ project.cta | default: 'Learn More' }}</a>
  {% endif %}
</article>
